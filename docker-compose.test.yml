# Disposable PostgreSQL exclusively for automated tests.
# Intentionally no published port or persistent volume. NEVER point tests at db.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kats_ci
      POSTGRES_USER: kats_ci
      POSTGRES_PASSWORD: local_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kats_ci -d kats_ci"]
      interval: 2s
      timeout: 3s
      retries: 25
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
