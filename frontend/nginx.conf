# Kats Properties · Nginx application edge (internal HTTP behind trusted TLS edge).
# This service must not be exposed directly to the public Internet without TLS.
limit_req_zone $binary_remote_addr zone=kats_api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=kats_connections:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  client_max_body_size 512k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 2 8k;

  limit_req_status 429;
  limit_conn_status 429;
  limit_conn kats_connections 30;

  # Never log tenant identifiers, reset links or query strings to access logs.
  # Application emits only redacted endpoint identifiers in production.
  access_log off;
  error_log /dev/stderr warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Inline style attributes in the current app require 'unsafe-inline'.
  # No unsafe-inline scripts, eval, frame/object embedding, or arbitrary forms.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' https:; img-src 'self' https: data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; manifest-src 'self'" always;

  location /api/ {
    limit_req zone=kats_api_per_ip burst=45 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite untrusted forwarded headers instead of appending client input.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 25s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_hide_header Server;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }
  location = /healthz { proxy_pass http://api:8000/healthz; access_log off; }
  location = /readyz { proxy_pass http://api:8000/readyz; access_log off; }
  location / {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' https:; img-src 'self' https: data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; manifest-src 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
