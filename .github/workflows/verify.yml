name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [perez, main]
# Cancel superseded commits instead of consuming browser/Windows runners for
# obsolete SHA checks. Keep main and PR-head concurrency independent.
concurrency:
  group: kats-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kats_ci
          POSTGRES_USER: kats_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kats_ci -d kats_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Check tracked files for committed secret signatures
        run: cd .. && python ops/check-secrets.py
      - name: Verify Docker-free SQLite preview bootstraps and serves API
        run: |
          cd ..
          mkdir -p .local
          export APP_ENV=development
          export KATS_PREVIEW_MODE=1
          export DATABASE_URL="sqlite:///$PWD/.local/kats-preview.sqlite3"
          export SECRET_KEY="preview_ci_only_secret_0123456789abcdef"
          export JWT_SECRET_KEY="preview_ci_only_jwt_0123456789abcdef"
          export REDIS_URL="memory://"
          export RATELIMIT_STORAGE_URI="memory://"
          export CELERY_BROKER_URL="memory://"
          export CELERY_RESULT_BACKEND="cache+memory://"
          export PUBLIC_REGISTRATION_ENABLED=false
          export MTN_MOMO_ENABLED=false
          export AIRTEL_MONEY_ENABLED=false
          export EFRIS_ENABLED=false
          python ops/init_preview.py
          (cd backend && python -m flask --app wsgi seed-permissions)
          (cd backend && python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.tasks import celery_app
          app=create_app()
          client=app.test_client()
          assert client.get('/healthz').status_code == 200
          assert client.get('/readyz').status_code == 200
          assert client.get('/api/v1/auth/me').status_code in (401, 422)
          assert celery_app.conf.task_always_eager is True
          print('SQLite preview API and eager local tasks: PASS')
          PY
          )
      - run: python -m pytest -q
        env:
          APP_ENV: testing
      - run: python -m compileall -q app
      - name: Compile optional browser and test database harness
        run: cd .. && python -m py_compile ops/test_browser_e2e.py ops/run_windows.py ops/test_windows.py backend/tests/prepare_postgres.py backend/tests/seed_e2e.py
      - run: python -m flask --app wsgi db upgrade
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - run: python -m flask --app wsgi db downgrade base && python -m flask --app wsgi db upgrade
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - name: PostgreSQL runtime invariants
        run: python -m pytest -q tests/test_postgres_invariants.py
        env:
          APP_ENV: testing
          TEST_POSTGRES_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - name: Configure restricted row-security test user
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://kats_ci:ci_only_password@localhost:5432/kats_ci") as conn:
              conn.execute("CREATE ROLE kats_rls_test LOGIN PASSWORD 'rls_ci_password'")
              conn.execute("GRANT USAGE ON SCHEMA public TO kats_rls_test")
              conn.execute("GRANT SELECT ON documents TO kats_rls_test")
              conn.execute("GRANT SELECT ON caretaker_assignments TO kats_rls_test")
              conn.execute("GRANT SELECT ON tenants, leases, invoices, payments, maintenance_requests, notifications TO kats_rls_test")
              conn.execute("GRANT UPDATE (full_name) ON tenants TO kats_rls_test")
          PY
      - name: PostgreSQL document and tenancy RLS isolation
        run: python -m pytest -q tests/test_postgres_document_rls.py tests/test_postgres_tenancy_rls.py
        env:
          APP_ENV: testing
          TEST_POSTGRES_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
          TEST_DOCUMENT_RLS_URL: postgresql://kats_rls_test:rls_ci_password@localhost:5432/kats_ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Run real Chromium checks with a disposable SQLite backend and the Vite proxy.
      # No third-party secrets or production databases are used.
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Chromium for responsive layout verification
        run: |
          python -m pip install -r ../backend/requirements.txt 'playwright>=1.56,<2'
          # Hosted Ubuntu already has Chromium runtime libraries. The
          # --with-deps option needlessly downloads optional font packages
          # from Ubuntu mirrors; DNS outages there blocked the browser suite.
          python -m playwright install chromium
      - name: Live browser ↔ Flask ↔ SQLite, access form, auth and responsive checks
        env:
          KATS_BASE_URL: http://127.0.0.1:5173
          APP_ENV: development
          KATS_PREVIEW_MODE: '1'
          SECRET_KEY: ci_preview_only_secret_0123456789abcdef
          JWT_SECRET_KEY: ci_preview_only_jwt_secret_0123456789abcdef
          REDIS_URL: memory://
          RATELIMIT_STORAGE_URI: memory://
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          CELERY_TASK_ALWAYS_EAGER: 'true'
          PUBLIC_REGISTRATION_ENABLED: 'false'
          MTN_MOMO_ENABLED: 'false'
          AIRTEL_MONEY_ENABLED: 'false'
          EFRIS_ENABLED: 'false'
          CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
        run: |
          set -eu
          cd ..
          mkdir -p .local
          export DATABASE_URL="sqlite:///$PWD/.local/kats-preview.sqlite3"
          python ops/init_preview.py
          (cd backend && python -m flask --app wsgi seed-permissions)
          # Synthetic, ignored SQLite data only: exercise actual OWNER/TENANT
          # workspaces at narrow and wide viewports; never use customer records.
          python ops/seed_demo_preview.py
          (cd backend && python -m flask --app wsgi run --no-reload --host 127.0.0.1 --port 8000) > /tmp/kats-api.log 2>&1 &
          API_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --strictPort) > /tmp/kats-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null && curl -fsS http://127.0.0.1:5173/readyz > /dev/null; then break; fi
            sleep 1
          done
          python -c 'from ops.run_windows import verify_http_bridge; verify_http_bridge()'
          python -m pytest -q ops/test_browser_e2e.py -k 'not test_read_only_authenticated_role_portals'
      - name: Check VS Code task JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('../.vscode/tasks.json','utf8')); JSON.parse(require('node:fs').readFileSync('../.vscode/extensions.json','utf8'))"
      - name: Validate Nginx edge configuration
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
      - name: Validate production Compose manifest using dummy example values
        run: |
          cd ..
          KATS_ENV_FILE=ops/production.env.sample docker compose --env-file ops/production.env.sample -f compose.production.yml config --quiet
      - name: Validate PowerShell developer commands (no Docker execution)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'ops/dev.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          & pwsh -NoProfile -File ../ops/dev.ps1 -Action help
      - name: Validate isolated browser E2E Compose configuration
        run: |
          cd ..
          KATS_E2E_SECRET_KEY=ci_disposable_secret_0123456789abcdef KATS_E2E_JWT_SECRET_KEY=ci_disposable_jwt_secret_0123456789abcdef docker compose -f compose.e2e.yml config --quiet
      - name: Validate native Windows dependency Compose (configuration only)
        run: |
          cd ..
          POSTGRES_PASSWORD=ci_local_native_only docker compose -f compose.native-deps.yml config --quiet
      - name: Validate disposable PostgreSQL test Compose
        run: |
          cd ..
          docker compose -f compose.verification.yml config --quiet
      - name: Validate Caddy production edge
        run: |
          cd ..
          docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" -e KATS_DOMAIN=example.com -e ACME_EMAIL=example@example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  windows-launcher-paths:
    # On Windows, SHIFT can alter %0 and break nested batch-file root paths.
    # Run on PRs or an explicitly marked push; conserve Windows CI minutes.
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[windows-task-check]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'Kats Property Management'
      - name: Smoke-check startup and tests batch dispatch with spaces in checkout path
        shell: pwsh
        env:
          KATS_PATH_CHECK_ONLY: '1'
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          Push-Location $repo
          try {
            & cmd.exe /d /c 'call start.bat'
            if ($LASTEXITCODE -ne 0) { throw 'start.bat root dispatch failed' }
            & cmd.exe /d /c 'call tests\test-all.bat'
            if ($LASTEXITCODE -ne 0) { throw 'tests\test-all.bat root dispatch failed' }
            & cmd.exe /d /c 'call tests\test-security.bat'
            if ($LASTEXITCODE -ne 0) { throw 'tests\test-security.bat root dispatch failed' }
            Push-Location (Join-Path $repo 'frontend')
            try {
              & cmd.exe /d /c '..\start.bat'
              if ($LASTEXITCODE -ne 0) { throw 'start.bat nested dispatch failed' }
              & cmd.exe /d /c '..\tests\test-all.bat'
              if ($LASTEXITCODE -ne 0) { throw 'tests\test-all.bat nested dispatch failed' }
            } finally { Pop-Location }
            # Execute all Windows VS Code process tasks through argument arrays,
            # with path-only mode preventing services or test suite execution.
            $tasks = (Get-Content (Join-Path $repo '.vscode/tasks.json') -Raw | ConvertFrom-Json).tasks
            $targets = @($tasks | Where-Object { $_.type -eq 'process' -and ($_.label -like 'KATS: Native *' -or $_.label -like 'KATS Test:*') })
            if ($targets.Count -ne 22) { throw "Expected 22 process tasks, got $($targets.Count)" }
            foreach ($task in $targets) {
              $taskArgs = @($task.args | ForEach-Object { $_.Replace('${workspaceFolder}', $repo) })
              Write-Host "Checking VS Code task: $($task.label)"
              & $task.command @taskArgs
              if ($LASTEXITCODE -ne 0) { throw "Task failed: $($task.label) (exit $LASTEXITCODE)" }
            }
          } finally { Pop-Location }

      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: Install backend dependencies for Windows Python 3.14 regression suite
        shell: pwsh
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          python -m pip install -r (Join-Path $repo 'backend/requirements.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Windows backend dependencies' }
          python -m pip install 'pytest-cov>=5,<7'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Windows test coverage dependencies' }
      - name: Run full backend coverage on Windows under SQLite test-runner settings
        shell: pwsh
        env:
          APP_ENV: testing
          DATABASE_URL: 'sqlite:///:memory:'
          RATELIMIT_STORAGE_URI: 'memory://'
          RATELIMIT_ENABLED: 'false'
          MTN_MOMO_ENABLED: 'false'
          AIRTEL_MONEY_ENABLED: 'false'
          EFRIS_ENABLED: 'false'
          EMAIL_PROVIDER_ENABLED: 'false'
          SMS_PROVIDER_ENABLED: 'false'
          PUBLIC_REGISTRATION_ENABLED: 'false'
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          Push-Location (Join-Path $repo 'backend')
          try {
            python -m pytest -q --cov=app --cov-report=term
            if ($LASTEXITCODE -ne 0) { throw "Windows backend coverage suite failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      # Actually start the Windows-native launcher with a real Vite/Flask
      # process and SQLite database. Path-only dispatch tests cannot prove
      # that the executable services start or that a browser can reach API.
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Windows native launch, live logs and safe shutdown smoke
        shell: pwsh
        env:
          KATS_DEV_BACKEND: preview
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          $out = Join-Path $env:RUNNER_TEMP 'kats-native-stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'kats-native-stderr.log'
          Push-Location $repo
          try {
            # Reuse tested Python dependencies from the preceding Windows
            # coverage job; keep a real project .venv and install Vite.
            & python -m venv --system-site-packages (Join-Path $repo '.venv')
            if ($LASTEXITCODE -ne 0) { throw 'Could not create project venv' }
            & npm.cmd --prefix frontend ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install frontend packages' }
            & python -c "import pathlib,hashlib; p=pathlib.Path('frontend/package-lock.json'); s=pathlib.Path('.local'); s.mkdir(exist_ok=True); (s/'npm-lock.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest())"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create local npm dependency stamp' }
            $python = (Get-Command python).Source
            $proc = Start-Process -FilePath $python -ArgumentList @('ops/run_windows.py','start') -WorkingDirectory $repo -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            try {
              $ready = $false
              for ($i = 0; $i -lt 75; $i++) {
                Start-Sleep -Seconds 1
                if ($proc.HasExited) { throw "Native launcher exited early ($($proc.ExitCode))" }
                try {
                  $response = Invoke-RestMethod -Uri 'http://127.0.0.1:5173/readyz' -TimeoutSec 3
                  if ($response.status -eq 'ready') { $ready = $true; break }
                } catch {}
              }
              if (-not $ready) { throw 'React-to-Flask-to-SQL was never ready' }
              & python ops/run_windows.py doctor
              if ($LASTEXITCODE -ne 0) { throw 'Native HTTP/API/database doctor failed' }
              if (-not (Test-Path (Join-Path $repo '.local/kats-preview.sqlite3'))) { throw 'SQLite preview database missing' }
              Start-Sleep -Seconds 2
              $log = Get-Content $out -Raw
              if ($log -notmatch '\[React\]' -or $log -notmatch '\[Flask\]' -or $log -notmatch '\[CONNECTED\]') {
                throw 'Launcher did not emit prefixed React, Flask and connected logs'
              }
              Write-Host '[PASS] Real native Windows React, Flask, SQLite and streaming logs.'
            } finally {
              & python ops/run_windows.py stop
              if (-not $proc.WaitForExit(25000)) {
                Write-Warning 'Launcher did not exit within graceful stop budget; collecting logs.'
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                throw 'Native launcher did not honor cooperative shutdown'
              }
              if (Test-Path $out) { Get-Content $out -Tail 90 }
              if (Test-Path $err) { Get-Content $err -Tail 60 }
            }
          } finally {
            Pop-Location
          }

      - name: Windows reuse running Flask and launch missing React
        shell: pwsh
        env:
          KATS_DEV_BACKEND: preview
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          $apiOut = Join-Path $env:RUNNER_TEMP 'kats-already-running-api.log'
          $apiErr = Join-Path $env:RUNNER_TEMP 'kats-already-running-api-err.log'
          $uiOut = Join-Path $env:RUNNER_TEMP 'kats-attach-ui.log'
          $uiErr = Join-Path $env:RUNNER_TEMP 'kats-attach-ui-err.log'
          $python = (Get-Command python).Source
          $api = $null
          $ui = $null
          Push-Location $repo
          try {
            $api = Start-Process -FilePath $python -ArgumentList @('ops/run_windows.py','backend') -WorkingDirectory $repo -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr -PassThru
            $apiReady = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              if ($api.HasExited) { throw "Standalone backend exited ($($api.ExitCode))" }
              try {
                $apiResponse = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/readyz' -TimeoutSec 2
                if ($apiResponse.status -eq 'ready') { $apiReady = $true; break }
              } catch {}
            }
            if (-not $apiReady) { throw 'Existing backend failed to become ready' }
            $ui = Start-Process -FilePath $python -ArgumentList @('ops/run_windows.py','start') -WorkingDirectory $repo -RedirectStandardOutput $uiOut -RedirectStandardError $uiErr -PassThru
            $uiReady = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              if ($ui.HasExited) { throw "Frontend+backend launcher exited ($($ui.ExitCode))" }
              try {
                $uiResponse = Invoke-RestMethod -Uri 'http://127.0.0.1:5173/readyz' -TimeoutSec 2
                if ($uiResponse.status -eq 'ready') { $uiReady = $true; break }
              } catch {}
            }
            if (-not $uiReady) { throw 'Frontend failed to start alongside existing backend' }
            & python ops/run_windows.py doctor
            if ($LASTEXITCODE -ne 0) { throw 'React proxy did not reach existing Flask' }
            $log = Get-Content $uiOut -Raw
            if ($log -notmatch '\[reuse\] Existing KATS backend' -or $log -notmatch '\[React\]' -or $log -notmatch '\[READY\]') {
              throw 'Missing React startup logs or existing-backend reuse acknowledgement'
            }
            Write-Host '[PASS] Already-running Flask + newly started React: both endpoints and logs verified.'
          } finally {
            & python ops/run_windows.py stop
            foreach ($process in @($ui,$api)) {
              if ($null -ne $process -and -not $process.WaitForExit(25000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw 'Combined and existing service did not exit after native stop'
              }
            }
            foreach ($file in @($apiOut,$apiErr,$uiOut,$uiErr)) {
              if (Test-Path $file) { Get-Content $file -Tail 50 }
            }
            Pop-Location
          }

      - name: Windows actual parallel split-task startup (backend LEFT, frontend RIGHT)
        shell: pwsh
        env:
          KATS_DEV_BACKEND: preview
          KATS_FAST_START: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:GITHUB_WORKSPACE 'Kats Property Management'
          $python = (Get-Command python).Source
          $backOut = Join-Path $env:RUNNER_TEMP 'kats-parallel-back.log'
          $backErr = Join-Path $env:RUNNER_TEMP 'kats-parallel-back-error.log'
          $frontOut = Join-Path $env:RUNNER_TEMP 'kats-parallel-front.log'
          $frontErr = Join-Path $env:RUNNER_TEMP 'kats-parallel-front-error.log'
          $back = $null
          $front = $null
          Push-Location $repo
          try {
            # Previous Windows smoke tests created the isolated .venv,
            # installed npm dependencies and initialized the preview DB.
            if (-not (Test-Path (Join-Path $repo '.venv/Scripts/python.exe'))) {
              throw 'The isolated test Python environment is missing'
            }
            if (-not (Test-Path (Join-Path $repo 'frontend/node_modules/vite/bin/vite.js'))) {
              throw 'The Vite CLI is missing'
            }
            if (-not (Test-Path (Join-Path $repo '.local/kats-preview.sqlite3'))) {
              throw 'The preview database is missing'
            }
            $started = Get-Date
            # Independent commands, no dependsOn=sequence or startup sleep.
            $back = Start-Process -FilePath $python -ArgumentList @('ops/run_windows.py', 'backend-stack') -WorkingDirectory $repo -RedirectStandardOutput $backOut -RedirectStandardError $backErr -PassThru
            $front = Start-Process -FilePath $python -ArgumentList @('ops/run_windows.py', 'frontend') -WorkingDirectory $repo -RedirectStandardOutput $frontOut -RedirectStandardError $frontErr -PassThru
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              if ($back.HasExited -or $front.HasExited) {
                throw "A parallel launcher exited prematurely: backend=$($back.HasExited), frontend=$($front.HasExited)"
              }
              Start-Sleep -Seconds 1
              try {
                $api = Invoke-RestMethod 'http://127.0.0.1:8000/readyz' -TimeoutSec 2
                $bridge = Invoke-RestMethod 'http://127.0.0.1:5173/readyz' -TimeoutSec 2
                if ($api.status -eq 'ready' -and $bridge.status -eq 'ready') {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'Both services did not become ready in parallel' }
            & python ops/run_windows.py doctor
            if ($LASTEXITCODE -ne 0) { throw 'Proxied React-Flask-SQL bridge check failed' }
            Start-Sleep -Seconds 1
            $left = Get-Content $backOut -Raw
            $right = Get-Content $frontOut -Raw
            if ($left -notmatch '\[Flask\]' -or $left -notmatch '\[READY\]') {
              throw 'Backend pane is missing Flask logs / readiness'
            }
            if ($right -notmatch '\[React\]' -or $right -notmatch '\[READY\]') {
              throw 'Frontend pane is missing React logs / readiness'
            }
            if ($left -match 'Installing changed' -or $right -match 'Installing changed' -or
                $left -match 'Seeding new route permissions' -or $right -match 'Running full JSX') {
              throw 'Normal startup performed slow install/build/DB preparation'
            }
            Write-Host '[PASS] Two independent Windows launchers ran in parallel with both live logs.'
          } finally {
            & python ops/run_windows.py stop
            foreach ($proc in @($front, $back)) {
              if ($null -ne $proc -and -not $proc.WaitForExit(25000)) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                throw 'Parallel task did not stop cleanly'
              }
            }
            foreach ($file in @($backOut, $backErr, $frontOut, $frontErr)) {
              if (Test-Path $file) { Get-Content $file -Tail 50 }
            }
            Pop-Location
          }
