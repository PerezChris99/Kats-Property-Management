name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [perez, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kats_ci
          POSTGRES_USER: kats_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kats_ci -d kats_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Check tracked files for committed secret signatures
        run: cd .. && python ops/check-secrets.py
      - run: python -m pytest -q
        env:
          APP_ENV: testing
      - run: python -m compileall -q app
      - name: Compile optional browser and test database harness
        run: cd .. && python -m py_compile ops/test_browser_e2e.py backend/tests/prepare_postgres.py
      - run: python -m flask --app wsgi db upgrade
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - run: python -m flask --app wsgi db downgrade base && python -m flask --app wsgi db upgrade
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - name: PostgreSQL runtime invariants
        run: python -m pytest -q tests/test_postgres_invariants.py
        env:
          APP_ENV: testing
          TEST_POSTGRES_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
      - name: Configure restricted row-security test user
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://kats_ci:ci_only_password@localhost:5432/kats_ci") as conn:
              conn.execute("CREATE ROLE kats_rls_test LOGIN PASSWORD 'rls_ci_password'")
              conn.execute("GRANT USAGE ON SCHEMA public TO kats_rls_test")
              conn.execute("GRANT SELECT ON documents TO kats_rls_test")
              conn.execute("GRANT SELECT ON caretaker_assignments TO kats_rls_test")
          PY
      - name: PostgreSQL document RLS isolation
        run: python -m pytest -q tests/test_postgres_document_rls.py
        env:
          APP_ENV: testing
          TEST_POSTGRES_URL: postgresql+psycopg://kats_ci:ci_only_password@localhost:5432/kats_ci
          TEST_DOCUMENT_RLS_URL: postgresql://kats_rls_test:rls_ci_password@localhost:5432/kats_ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check VS Code task JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('../.vscode/tasks.json','utf8')); JSON.parse(require('node:fs').readFileSync('../.vscode/extensions.json','utf8'))"
      - name: Validate Nginx edge configuration
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
      - name: Validate production Compose manifest using dummy example values
        run: |
          cd ..
          KATS_ENV_FILE=ops/production.env.sample docker compose --env-file ops/production.env.sample -f compose.production.yml config --quiet
      - name: Validate Caddy production edge
        run: |
          cd ..
          docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" -e KATS_DOMAIN=example.com -e ACME_EMAIL=example@example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
